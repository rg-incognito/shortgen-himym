name: Generate HIMYM Shorts

on:
  schedule:
    - cron: '0 0 * * *'    # 7:00 PM US Eastern (EST/UTC-5) — North America evening prime time
    - cron: '0 2 * * *'    # 9:00 PM US Eastern (EST/UTC-5) — North America evening prime time
  workflow_dispatch:
    inputs:
      video_file_id:
        description: 'Drive File ID — leave blank to auto-pick from videos/ folder'
        required: false
        default: ''
      episode_name:
        description: 'Episode name (e.g. himym_s01e01) — auto-detected if blank'
        required: false
        default: ''
      whisper_model:
        description: 'Whisper model: base (fast) | small (accurate) | medium (best)'
        required: false
        default: 'medium'

# Required GitHub Secrets:
#   GOOGLE_SERVICE_ACCOUNT_JSON  — full JSON of the service account key file
#   GEMINI_API_KEY               — from aistudio.google.com/app/apikey
#   GOOGLE_REFRESH_TOKEN         — run setup_oauth.py locally (covers Drive + YouTube)
#   GOOGLE_CLIENT_ID             — OAuth client ID
#   GOOGLE_CLIENT_SECRET         — OAuth client secret
#   HF_TOKEN                     — HuggingFace token (free) for pyannote diarization
#   YT_TOKEN_JSON                — run setup_yt_oauth.py locally, select HIMYM channel
# NOTE: refresh token auto-refreshes — no re-auth needed as long as workflow runs regularly
#
# Failover secrets (optional — auto-switches account when minutes run low):
#   FAILOVER_SELF_TOKEN  — classic PAT for THIS account (rg-incognito) with scopes: repo, user
#   FAILOVER_NEXT_TOKEN  — classic PAT for NEXT account (rg-incognito1) with scopes: repo, workflow

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Failover — switch to standby account if minutes are low
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SELF_TOKEN: ${{ secrets.FAILOVER_SELF_TOKEN }}
          NEXT_TOKEN: ${{ secrets.FAILOVER_NEXT_TOKEN }}
        run: |
          [ -z "$SELF_TOKEN" ] && echo "FAILOVER_SELF_TOKEN not set — skipping" && exit 0

          MONTH=$(date -u +%Y-%m)
          USAGE_JSON=$(curl -sf --retry 2 \
            -H "Authorization: Bearer $SELF_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/rg-incognito/settings/billing/usage") || true

          USED=$(echo "$USAGE_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          m='$MONTH'
          print(int(sum(float(i.get('quantity',0)) for i in d.get('usageItems',[])
                        if i.get('product')=='actions' and i.get('unitType')=='Minutes'
                        and str(i.get('date','')).startswith(m))))
          " 2>/dev/null) || USED=0

          LEFT=$((2000 - ${USED:-0}))
          echo "Minutes this month: used=${USED}  left=${LEFT} / 2000"

          if [ "${LEFT}" -lt 350 ]; then
            [ -z "$NEXT_TOKEN" ] && echo "FAILOVER_NEXT_TOKEN not set — cannot switch" && exit 0
            echo "Low on minutes — switching to rg-incognito1"
            curl -sf -X PUT \
              -H "Authorization: Bearer $NEXT_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/rg-incognito1/shortgen-himym/actions/workflows/generate_shorts.yml/enable"
            curl -sf -X PUT \
              -H "Authorization: Bearer $SELF_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/rg-incognito/shortgen-himym/actions/workflows/generate_shorts.yml/disable"
            echo "Failover done — rg-incognito1 is now active, this workflow disabled"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg-master-latest-linux64-gpl*

      - name: Install fonts for hook-card overlay (bold text + color emoji)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-color-emoji

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-torch200-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install --no-deps torch==2.0.0+cpu torchaudio==2.0.0+cpu --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.0.0+cpu\ntorchaudio==2.0.0+cpu\n' > /tmp/constraints.txt
          pip install -r requirements.txt -c /tmp/constraints.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-whisper-${{ github.event.inputs.whisper_model || 'medium' }}-pyannote-3.1-v2

      - name: Pre-download models
        run: python src/preload_models.py
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'medium' }}

      - name: Write YouTube token
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then echo "$YT_TOKEN_JSON" > yt_token.json; fi

      - name: Generate shorts
        run: python src/main.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_REFRESH_TOKEN:        ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:        ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN:                    ${{ secrets.HF_TOKEN }}
          SPREADSHEET_ID:              ${{ secrets.HIMYM_SPREADSHEET_ID }}
          VIDEO_FILE_ID:               ${{ github.event.inputs.video_file_id }}
          EPISODE_NAME:                ${{ github.event.inputs.episode_name }}
          WHISPER_MODEL:               ${{ github.event.inputs.whisper_model || 'medium' }}
          VIDEOS_FOLDER_ID:  ${{ secrets.HIMYM_VIDEOS_FOLDER_ID }}
          SHORTS_FOLDER_ID:  ${{ secrets.HIMYM_SHORTS_FOLDER_ID }}
          ARCHIVE_FOLDER_ID: ${{ secrets.HIMYM_ARCHIVE_FOLDER_ID }}
